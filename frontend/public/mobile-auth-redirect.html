<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecionando...</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
        gap: 16px;
      }
      a.button {
        display: inline-block;
        padding: 14px 28px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
      }
      #debug {
        width: 100%;
        max-width: 600px;
        text-align: left;
        font-size: 11px;
        line-height: 1.5;
        background: #111;
        color: #0f0;
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <p>Redirecionando de volta para o app MaPinha...</p>
    <a id="open-app" class="button" href="#">Abrir o app MaPinha</a>
    <pre id="debug">(carregando...)</pre>
    <script>
      // Página-ponte: o Google OAuth só aceita redirect URIs https (não
      // aceita mais esquemas customizados tipo "mapinha://" diretamente,
      // nem para o client tipo "Web"). Então o Google volta pra cá, e esta
      // página repassa o resultado (id_token etc, vem no fragmento #) pro
      // app via deep link.
      //
      // Achado real (10/11/2026, testando num Android físico): o Chrome
      // ignora silenciosamente um <a href="mapinha://...">/location.replace
      // com esquema customizado "cru" — nem erro, nem diálogo, nem log (ver
      // issues do fórum Expo/SO sobre isso). O formato que o Chrome de fato
      // honra é a sintaxe própria dele, "intent://...#Intent;...;end", que
      // força a resolução via Intent do Android mesmo sem ser um link
      // http(s) verificado. Por isso usamos esse formato no Android (Chrome
      // e a maioria dos browsers baseados nele) e o esquema puro como
      // fallback nos demais (ex: Safari no iOS, que não entende
      // "intent://"). O payload vai como query string (não fragmento) nos
      // dois casos — mais simples de recuperar os parâmetros no app
      // (`new URL(url).searchParams`) e a sintaxe "intent://" não convive
      // bem com um "#" literal no meio (ela já usa "#Intent;...;end").
      var payload = window.location.hash.slice(1); // remove o "#" inicial
      var isAndroid = /Android/.test(navigator.userAgent);
      var deepLink = isAndroid
        ? "intent://auth?" +
          payload +
          "#Intent;scheme=mapinha;package=com.mapinha.mobile;S.browser_fallback_url=" +
          encodeURIComponent(window.location.href) +
          ";end"
        : "mapinha://auth?" + payload;

      // Caixa de debug visível na própria página (temporária, só pra
      // diagnosticar o botão não funcionando — sem acesso a devtools no
      // celular, não tem como ver console.log de outro jeito).
      var debugEl = document.getElementById("debug");
      var logLines = [];
      function log(line) {
        logLines.push(new Date().toISOString().slice(11, 19) + " " + line);
        debugEl.textContent = logLines.join("\n");
      }

      log("user-agent: " + navigator.userAgent);
      log("href completa: " + window.location.href);
      log("hash bruto (" + window.location.hash.length + " chars): " + window.location.hash);
      log("deepLink calculado: " + deepLink);

      try {
        document.getElementById("open-app").href = deepLink;
        log("href do botão setado com sucesso");
      } catch (e) {
        log("ERRO ao setar href: " + e);
      }

      document.getElementById("open-app").addEventListener("click", function (ev) {
        log("clique detectado no botão");
        try {
          window.location.href = deepLink;
          log("window.location.href chamado sem lançar erro");
        } catch (e) {
          log("ERRO ao navegar: " + e);
        }
      });

      try {
        window.location.replace(deepLink);
        log("tentativa automática (location.replace) chamada sem lançar erro");
      } catch (e) {
        log("ERRO na tentativa automática: " + e);
      }
    </script>
  </body>
</html>
